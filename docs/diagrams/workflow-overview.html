<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delegate Workflow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Delegate-Skills</p>
    <h1>Seven phases, one review gate</h1>

    <!-- Replace delegate-workflow with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="delegate-workflow-title delegate-workflow-desc">
        <title id="delegate-workflow-title">Delegate-skills 7-phase workflow</title>
        <desc id="delegate-workflow-desc">Seven workflow phases from issue creation to follow-up, where code review either passes to merge or sends a fix brief back to OpenCode.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        
        <!-- arrows -->
        <path d="M200 136 H280" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <path d="M440 136 H520" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <path d="M680 136 H760" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <path d="M840 172 V252" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <path d="M760 288 H680" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <path d="M520 288 H440" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <path d="M280 288 H200" fill="none" stroke="#4f5d75" stroke-width="1.25" marker-end="url(#arrow)"/>
        <path d="M600 336 V384 Q600 392 608 392 H932 Q940 392 940 384 V144 Q940 136 932 136 H920" fill="none" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <rect x="456.0" y="266" width="48" height="16" fill="#f5f5f5"/>
        <text x="480" y="278" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.1em" fill="#4f5d75">PASS</text>
        <rect x="736.0" y="370" width="88" height="16" fill="#f5f5f5"/>
        <text x="780" y="382" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.1em" fill="#bf4520">FIX BRIEF</text>
        
        <!-- nodes -->
        <rect x="40" y="100" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="122" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.08em" fill="#4f5d75">01 · CLAUDE</text>
        <text x="52" y="143" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Issue Creation</text>
        <text x="52" y="160" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">tracking issue first</text>
        <rect x="280" y="100" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="292" y="122" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.08em" fill="#4f5d75">02 · CLAUDE</text>
        <text x="292" y="143" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Analysis &amp; Planning</text>
        <text x="292" y="160" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">clarify, model, spec</text>
        <rect x="520" y="100" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="532" y="122" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.08em" fill="#4f5d75">03 · CLAUDE + USER</text>
        <text x="532" y="143" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Implementation Plan</text>
        <text x="532" y="160" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">discuss with user</text>
        <rect x="760" y="100" width="160" height="72" rx="6" fill="#fbe9e3" stroke="#bf4520" stroke-width="1.5"/>
        <text x="772" y="122" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.08em" fill="#bf4520">04 · OPENCODE</text>
        <text x="772" y="143" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Delegate to OpenCode</text>
        <text x="772" y="160" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">scoped brief, --file</text>
        <rect x="760" y="252" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="772" y="274" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.08em" fill="#4f5d75">05 · CLAUDE</text>
        <text x="772" y="295" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Code Review</text>
        <text x="772" y="312" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">re-run tests yourself</text>
        
        <polygon points="600,240 680,288 600,336 520,288" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600" y="285" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">Review</text>
        <text x="600" y="301" text-anchor="middle" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600" fill="#2d3142">passes?</text>
        <rect x="280" y="252" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="292" y="274" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.08em" fill="#4f5d75">06 · USER</text>
        <text x="292" y="295" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Merge &amp; Close</text>
        <text x="292" y="312" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">user approves, closes #N</text>
        <rect x="40" y="252" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="274" font-family="'Geist Mono', ui-monospace, monospace" font-size="9" font-weight="500" letter-spacing="0.08em" fill="#4f5d75">07 · CLAUDE</text>
        <text x="52" y="295" font-family="Geist, system-ui, sans-serif" font-size="13" font-weight="600" fill="#2d3142">Tracking &amp; Follow-up</text>
        <text x="52" y="312" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">tickets, ADR, handoff</text>
        
        <!-- legend -->
        <line x1="40" y1="436" x2="920" y2="436" stroke="#2d3142" stroke-opacity="0.15"/>
        <rect x="40" y="448" width="20" height="12" rx="3" fill="#fff" stroke="#2d3142"/><text x="68" y="458" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">PHASE</text>
        <polygon points="152,447 162,454 152,461 142,454" fill="#fff" stroke="#2d3142"/><text x="172" y="458" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">DECISION</text>
        <rect x="268" y="448" width="20" height="12" rx="3" fill="#fbe9e3" stroke="#bf4520" stroke-width="1.5"/><text x="296" y="458" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">IMPLEMENTER</text>
        <line x1="408" y1="454" x2="432" y2="454" stroke="#bf4520" stroke-width="1.5" stroke-dasharray="5,4"/><text x="440" y="458" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" fill="#4f5d75">REWORK LOOP</text>


      </svg>
    </div>
  </div>
</body>
</html>
